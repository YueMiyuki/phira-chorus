[workspace]
members = ["chorus-proto", "chorus-client", "chorus-server", "chorus-bench"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
chorus-proto = { path = "chorus-proto" }
chorus-client = { path = "chorus-client" }
chorus-bench = { path = "chorus-bench" }

anyhow = "1.0"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
fastrand = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Function names stay for backtraces; line tables would triple the size
strip = "debuginfo"
